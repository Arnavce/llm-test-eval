[metadata]
name = llm-test-eval
version = 1.0.0
description = Evaluating LLM-generated Python unit tests with cyclomatic complexity, coverage and mutation testing
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    pytest>=7.4
    pytest-cov>=4.1
    radon>=6.0
    mutmut>=2.4
    pandas>=2.0
    scipy>=1.10
    matplotlib>=3.7
    tabulate>=0.9

[options.packages.find]
exclude =
    generated_tests*
    results*
    .venv*

[tool:pytest]
# ``pythonpath`` makes the benchmark package importable from the repository
# root without installing the project (pytest >= 7).
pythonpath = .
testpaths =
    baselines
    generated_tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    slow: long-running end-to-end checks
filterwarnings =
    error::DeprecationWarning:pipeline.*

[coverage:run]
branch = True
source = benchmark
omit =
    benchmark/__init__.py
    .venv/*
    */site-packages/*
    generated_tests/*
    baselines/*

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    if __name__ == .__main__.:

[flake8]
max-line-length = 100
extend-ignore = E203, W503

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[isort]
profile = black
known_first_party = pipeline,benchmark,baselines
